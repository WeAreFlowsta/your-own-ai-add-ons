name: Rebuild index
# main only: index.json is what the app and the site read.
on:
  push:
    branches: [main]
    paths: ["characters/**", "skills/**", "tools/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      # Pushes as the yourownai bot: main requires the verify + AI review
      # checks, and the Write role is on the bypass list for this one commit.
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.ADDONS_GITHUB_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: npm run verify
      - run: npm run index
      - name: Commit index.json
        run: |
          git config user.name "add-ons-directory bot"
          git config user.email "bot@yourownai.net"
          git add index.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "index: rebuild"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit
      # yourownai.net bakes the directory in at build time: ask Cloud Build
      # to rebuild + deploy production (same main, fresh index) so a merged
      # share is on the site within minutes, not at the next manual deploy.
      - name: Rebuild yourownai.net
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.REDEPLOY_WEBHOOK_URL }}
        run: |
          [ -n "$HOOK" ] || { echo "no REDEPLOY_WEBHOOK_URL - skipped"; exit 0; }
          curl -sf -X POST -H "Content-Type: application/json" -d '{"source":"add-ons-index"}' "$HOOK" > /dev/null && echo "site rebuild requested"
